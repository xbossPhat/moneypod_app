services:
  # 1. DATABASE POSTGRESQL
  db:
    image: postgres:16-alpine
    container_name: moneypod_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD} #Lấy từ file .env
      - POSTGRES_DB=moneypod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moneypod-net

  # 2. BACKEND SERVICE
  backend:
    build: .
    container_name: moneypod_api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD} #Lấy từ file .env
      - DB_NAME=moneypod
      - APP_PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY} #Lấy từ file .env
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash} #Mặc định Gemini 3.8 Flash thế hệ mới nhất
    networks:
      - moneypod-net

  # 3. NGROK (Tùy chọn - chỉ dùng khi cần public API ra ngoài Internet cho điện thoại thật)
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: moneypod_ngrok
  #   restart: unless-stopped
  #   command:
  #     - "http"
  #     - "--domain=${NGROK_DOMAIN}"
  #     - "backend:8080"
  #   environment:
  #     NGROK_AUTHTOKEN: "${NGROK_AUTH}"
  #   depends_on:
  #     - backend
  #   networks:
  #     - moneypod-net

volumes:
  postgres_data:

networks:
  moneypod-net:
    driver: bridge
