services:
  # 1. DATABASE POSTGRESQL
  db:
    image: postgres:16-alpine
    container_name: moneypod_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=moneypod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - moneypod-net

  # 2. BACKEND SERVICE
  backend:
    build: .
    container_name: moneypod_api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./.env:/root/.env
      - ./serviceAccountKey.json:/root/serviceAccountKey.json
    networks:
      - moneypod-net

volumes:
  postgres_data:

networks:
  moneypod-net:
    driver: bridge
